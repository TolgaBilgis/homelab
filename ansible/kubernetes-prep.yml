---
- name: Prepare nodes for Kubernetes
  hosts: homelab
  become: true

  tasks:
    - name: Check active swap
      ansible.builtin.command: swapon --show --noheadings
      register: active_swap
      changed_when: false

    - name: Disable active swap
      ansible.builtin.command: swapoff -a
      when: active_swap.stdout | length > 0
      changed_when: true

    - name: Prevent swap from returning after reboot
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^(\s*[^#\s]+\s+\S+\s+swap\s+.*)$'
        replace: '# \1'
        backup: true
    - name: Enable persistent IPv4 forwarding
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-kubernetes.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          net.ipv4.ip_forward = 1

    - name: Check current IPv4 forwarding
      ansible.builtin.command: sysctl -n net.ipv4.ip_forward
      register: ipv4_forwarding
      changed_when: false

    - name: Enable IPv4 forwarding immediately
      ansible.builtin.command: sysctl -w net.ipv4.ip_forward=1
      when: ipv4_forwarding.stdout != "1"
      changed_when: true

    - name: Load bridge networking module at boot
      ansible.builtin.copy:
        dest: /etc/modules-load.d/kubernetes.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          br_netfilter

    - name: Load bridge networking module now
      ansible.builtin.command:
        cmd: modprobe br_netfilter
        creates: /sys/module/br_netfilter
