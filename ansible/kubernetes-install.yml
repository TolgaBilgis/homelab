---
- name: Install Kubernetes tools
  hosts: homelab
  become: true

  vars:
    kubernetes_minor: "v1.36"
    kubernetes_repo: "https://pkgs.k8s.io/core:/stable:/{{ kubernetes_minor }}/deb/"

  tasks:
    - name: Install repository prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - python3-apt
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Ensure APT keyring directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download Kubernetes repository signing key
      ansible.builtin.get_url:
        url: "{{ kubernetes_repo }}Release.key"
        dest: /etc/apt/keyrings/kubernetes.asc
        mode: "0644"

    - name: Add Kubernetes package repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [signed-by=/etc/apt/keyrings/kubernetes.asc]
          {{ kubernetes_repo }} /
        filename: kubernetes
        state: present

    - name: Install Kubernetes packages
      ansible.builtin.apt:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: present
        update_cache: true

    - name: Hold Kubernetes packages for controlled upgrades
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - kubelet
        - kubeadm
        - kubectl

    - name: Enable kubelet at boot
      ansible.builtin.systemd:
        name: kubelet
        enabled: true
