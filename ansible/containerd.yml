- name: Install container runtime
  hosts: homelab
  become: true

  tasks:
    - name: Install containerd
      ansible.builtin.package:
        name: containerd
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Enable and start containerd service
      ansible.builtin.systemd:
        name: containerd
        enabled: true
        state: started

    - name: Check containerd version
      ansible.builtin.command: containerd --version
      register: containerd_version
      changed_when: false

    - name: Display containerd version
      ansible.builtin.debug:
        msg: "Containerd version: {{ containerd_version.stdout }}"
    
    - name: Ensure containerd configuration directory exists
      ansible.builtin.file:
        path: /etc/containerd
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Configure containerd for Kubernetes
      ansible.builtin.copy:
        dest: /etc/containerd/config.toml
        owner: root
        group: root
        mode: '0644'
        backup: true
        content: |
          version = 3

          [plugins."io.containerd.cri.v1.runtime".containerd]
            default_runtime_name = "runc"

          [plugins."io.containerd.cri.v1.runtime".containerd.runtimes.runc]
            runtime_type = "io.containerd.runc.v2"

          [plugins."io.containerd.cri.v1.runtime".containerd.runtimes.runc.options]
            SystemdCgroup = true
      notify: Restart containerd

  handlers:
    - name: Restart containerd
      ansible.builtin.systemd:
        name: containerd
        state: restarted
